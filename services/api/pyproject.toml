[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorago-api"
version = "0.1.0"
description = "Dorago server-authoritative travel itinerary API"
requires-python = ">=3.12"
dependencies = [
  "aiosmtplib>=3.0,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "httpx>=0.27,<1",
  "pyjwt>=2.9,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5.1,<6",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires an isolated PostgreSQL database whose name ends in _test",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
  "B008", # FastAPI intentionally declares dependencies in parameter defaults.
  "S101", # Assertions remain useful in tests and validated impossible branches.
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/auth/schemas.py" = ["S105"]
"app/documents/schemas.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
