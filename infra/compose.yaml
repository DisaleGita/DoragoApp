name: dorago

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  # Private S3-compatible object storage. MinIO no longer publishes pullable
  # Docker images, so SeaweedFS (Apache-2.0) provides the same S3 API. The S3
  # identity is written from .env at start-up; no credentials live in the repo.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf '{"identities":[{"name":"dorago-api","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
        -filer -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # Anonymous requests are refused (403); any HTTP answer means S3 is up.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [private]

  storage-init:
    build:
      context: ../services/api
    env_file: ../.env
    command:
      - python
      - -c
      - >-
        import asyncio;
        from app.core.config import get_settings;
        from app.documents.storage import PrivateObjectStorage;
        asyncio.run(PrivateObjectStorage(get_settings()).ensure_bucket())
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    networks: [private]

  migrate:
    build:
      context: ../services/api
    env_file: ../.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    expose: ["8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  flutter-web:
    build:
      context: ../apps/flutter
      args:
        API_BASE_URL: /api/v1
    restart: unless-stopped
    expose: ["8080"]
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      flutter-web:
        condition: service_started
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  caddy-data:
  caddy-config:
