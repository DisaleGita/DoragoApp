# Render Blueprint for the free demo deployment (see docs/FREE_DEPLOYMENT.md).
# Values marked `sync: false` are entered in the Render dashboard and are never
# stored in this repository.
services:
  - type: web
    name: dorago-api
    runtime: docker
    plan: free
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: ENABLE_DEV_OTP_BYPASS
        value: "false"
      - key: APP_DOMAIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_USE_SSL
        value: "true"
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
