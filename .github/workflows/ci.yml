name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dorago_test
          POSTGRES_USER: dorago_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dorago_test -d dorago_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://dorago_test:test-only-password@localhost:5432/dorago_test
      TEST_DATABASE_URL: postgresql+asyncpg://dorago_test:test-only-password@localhost:5432/dorago_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test-jwt-secret-that-is-never-used-in-production
      OTP_HASH_SECRET: test-otp-secret-that-is-never-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e './services/api[dev]'
      - run: ruff check services/api
      - run: ruff format --check services/api
      - run: mypy services/api/app
      - run: alembic upgrade head
        working-directory: services/api
      - run: alembic check
        working-directory: services/api
      - run: alembic downgrade base
        working-directory: services/api
      - run: pytest -q services/api/tests

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/flutter
      - run: dart run build_runner build
        working-directory: apps/flutter
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/flutter
      - run: flutter analyze
        working-directory: apps/flutter
      - run: flutter test
        working-directory: apps/flutter
      - run: flutter build web --release --dart-define=API_BASE_URL=/api/v1
        working-directory: apps/flutter
      - run: flutter build apk --debug
        working-directory: apps/flutter
      - run: flutter build appbundle --release
        working-directory: apps/flutter

  flutter-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/flutter
      - run: dart run build_runner build
        working-directory: apps/flutter
      - run: flutter build ios --release --no-codesign
        working-directory: apps/flutter
