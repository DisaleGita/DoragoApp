server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Flutter web output (main.dart.js, flutter_bootstrap.js, drift_worker.js,
  # sqlite3.wasm) keeps the same file names across releases, so browsers must
  # revalidate them instead of caching them as immutable.
  location ~* \.(?:js|css|wasm|png|jpg|jpeg|svg|ico)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
