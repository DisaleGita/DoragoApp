name: dorago
description: Secure cross-platform Dorago travel itinerary client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.0.0
  go_router: ^18.0.1
  intl: ^0.20.3
  path_provider: ^2.1.5
  timezone: ^0.11.0
  uuid: ^4.5.2
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.34.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
